name: Deploy Logic App

on:
  push:
    branches: [dev, uat, main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # We'll set the environment explicitly via a step output
    environment: ${{ steps.set-env.outputs.ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine environment
        id: set-env
        run: |
          echo "GITHUB_BRANCH=${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi
          echo "ENV=${GITHUB_REF_NAME}"  # just for logging
          echo "::set-output name=ENV::${GITHUB_REF_NAME}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Logic App
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: rg-la-${{ env.ENV }}
          template: infra/main.bicep
          parameters: infra/params.${{ env.ENV }}.json
