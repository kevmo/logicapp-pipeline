name: Deploy Logic App

on:
  push:
    branches: [dev, uat, main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Simple branch → ENV mapping
      - name: Set ENV
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
          elif [ "${GITHUB_REF_NAME}" = "uat" ]; then
            echo "ENV=uat" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi
          echo "Environment is $ENV"

      # OIDC login (no secret, no auth-type)
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}

      # Deploy Logic App via Bicep
      - name: Deploy Logic App
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: rg-la-${{ env.ENV }}
          template: infra/main.bicep
          parameters: infra/params.${{ env.ENV }}.json
